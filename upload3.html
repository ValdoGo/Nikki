<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streamtape File Uploader & Manager</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 680px;
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #38bdf8;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #94a3b8;
    }

    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    .folder-section {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .folder-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .breadcrumb {
      font-size: 13px;
      color: #38bdf8;
      font-weight: bold;
      word-break: break-all;
      margin-bottom: 10px;
    }

    .folder-list {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 5px;
      margin-bottom: 10px;
      background-color: #1e293b;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid #334155;
      font-size: 14px;
      transition: background 0.2s;
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .list-item:hover {
      background-color: #334155;
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .item-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-action {
      padding: 4px 8px;
      font-size: 12px;
      border: none;
      border-radius: 4px;
      background-color: #0284c7;
      color: white;
      cursor: pointer;
    }

    .btn-action:hover {
      background-color: #0369a1;
    }

    .btn-action.btn-info {
      background-color: #475569;
    }

    .btn-action.btn-info:hover {
      background-color: #64748b;
    }

    .create-folder-box {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      padding: 8px 12px;
      background-color: #334155;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    button.btn-main {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background-color: #0284c7;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    button.btn-main:hover {
      background-color: #0369a1;
    }

    button:disabled {
      background-color: #475569 !important;
      cursor: not-allowed;
    }

    .progress-container {
      margin-top: 20px;
      display: none;
    }

    .progress-bar-bg {
      width: 100%;
      background-color: #334155;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #10b981;
      transition: width 0.1s ease;
    }

    .status-text {
      margin-top: 8px;
      font-size: 13px;
      text-align: center;
      color: #cbd5e1;
    }

    .result-box {
      margin-top: 20px;
      padding: 14px;
      border-radius: 6px;
      background-color: #0f172a;
      border: 1px solid #334155;
      word-break: break-all;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }

    .result-box a {
      color: #38bdf8;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Streamtape Manager & Uploader</h2>
    
    <div class="form-group">
      <label for="apiLogin">API Login:</label>
      <input type="text" id="apiLogin" value="f72b6b89185b216eb276">
    </div>

    <div class="form-group">
      <label for="apiKey">API Key / Password:</label>
      <input type="text" id="apiKey" value="9PXpxzpoMmFaazG">
    </div>

    <!-- Navegação, Criação e Listagem de Pastas/Ficheiros -->
    <div class="folder-section">
      <div class="folder-header">
        <label>Navegador de Ficheiros e Pastas:</label>
        <button class="btn-secondary" onclick="loadFolders()">🔄 Atualizar</button>
      </div>
      <div class="breadcrumb" id="breadcrumb">Pasta Atual: Raiz ( / )</div>
      
      <div class="folder-list" id="folderList">
        <div class="list-item">Carregando...</div>
      </div>

      <div class="create-folder-box">
        <input type="text" id="newFolderName" placeholder="Nome da nova subpasta...">
        <button class="btn-secondary" onclick="createNewFolder()">+ Criar Pasta</button>
      </div>
    </div>

    <div class="form-group">
      <label for="fileInput">Selecione o Vídeo (.mp4, .mkv, etc):</label>
      <input type="file" id="fileInput">
    </div>

    <div class="form-group">
      <label for="customFileName">Novo Nome para o Arquivo (Opcional):</label>
      <input type="text" id="customFileName" placeholder="Ex: Meu_Video_Personalizado.mp4">
    </div>

    <button class="btn-main" id="uploadBtn" onclick="startUpload()">Enviar Arquivo</button>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
      <div class="status-text" id="statusText">Iniciando...</div>
    </div>

    <div class="result-box" id="resultBox"></div>
  </div>

  <script>
    let folderHistory = [{ id: '', name: 'Raiz' }];

    window.onload = function() {
      loadFolders();
    };

    function getCurrentFolderId() {
      return folderHistory[folderHistory.length - 1].id;
    }

    // Carrega e exibe as pastas e ficheiros
    async function loadFolders() {
      const login = document.getElementById('apiLogin').value.trim();
      const key = document.getElementById('apiKey').value.trim();
      const folderList = document.getElementById('folderList');
      const breadcrumb = document.getElementById('breadcrumb');

      const currentFolder = folderHistory[folderHistory.length - 1];
      breadcrumb.innerText = 'Pasta Atual: ' + folderHistory.map(f => f.name).join(' / ');

      folderList.innerHTML = '<div class="list-item">Carregando conteúdos...</div>';

      try {
        let url = `https://api.streamtape.com/file/listfolder?login=${encodeURIComponent(login)}&key=${encodeURIComponent(key)}`;
        if (currentFolder.id) {
          url += `&folder=${encodeURIComponent(currentFolder.id)}`;
        }

        const response = await fetch(url);
        const data = await response.json();

        if (data.status !== 200) {
          folderList.innerHTML = `<div class="list-item" style="color:#ef4444;">Erro ao carregar: ${data.msg}</div>`;
          return;
        }

        folderList.innerHTML = '';

        // Botão para voltar pasta
        if (folderHistory.length > 1) {
          const backItem = document.createElement('div');
          backItem.className = 'list-item';
          backItem.style.fontWeight = 'bold';
          backItem.style.cursor = 'pointer';
          backItem.innerHTML = `<div class="item-info"><span>⬆️</span> .. (Voltar Pasta)</div>`;
          backItem.onclick = function() {
            folderHistory.pop();
            loadFolders();
          };
          folderList.appendChild(backItem);
        }

        const folders = data.result.folders || [];
        const files = data.result.files || [];

        // Renderiza Pastas
        folders.forEach(folder => {
          const item = document.createElement('div');
          item.className = 'list-item';
          item.style.cursor = 'pointer';
          item.innerHTML = `<div class="item-info"><span>📁</span> ${folder.name}</div>`;
          item.onclick = function() {
            folderHistory.push({ id: folder.id, name: folder.name });
            loadFolders();
          };
          folderList.appendChild(item);
        });

        // Renderiza Ficheiros
        files.forEach(file => {
          const fileId = file.linkid || file.id;
          const item = document.createElement('div');
          item.className = 'list-item';
          item.innerHTML = `
            <div class="item-info" title="${file.name}">
              <span>🎥</span> <span>${file.name}</span> <small style="color:#94a3b8;">(${formatBytes(file.size)})</small>
            </div>
            <div class="item-actions">
              <button class="btn-action btn-info" onclick="checkFileInfo('${fileId}')">ℹ️ Info</button>
              <button class="btn-action" onclick="openVideoLink('${fileId}')">🔗 Abrir / Baixar</button>
            </div>
          `;
          folderList.appendChild(item);
        });

        if (folders.length === 0 && files.length === 0) {
          const emptyItem = document.createElement('div');
          emptyItem.className = 'list-item';
          emptyItem.style.color = '#94a3b8';
          emptyItem.innerText = 'Nenhuma pasta ou ficheiro encontrado aqui.';
          folderList.appendChild(emptyItem);
        }

      } catch (err) {
        folderList.innerHTML = `<div class="list-item" style="color:#ef4444;">Erro de conexão ao buscar conteúdos.</div>`;
      }
    }

    // Criar nova pasta
    async function createNewFolder() {
      const login = document.getElementById('apiLogin').value.trim();
      const key = document.getElementById('apiKey').value.trim();
      const folderNameInput = document.getElementById('newFolderName');
      const folderName = folderNameInput.value.trim();
      const currentFolderId = getCurrentFolderId();

      if (!folderName) {
        alert('Digite o nome da pasta que deseja criar.');
        return;
      }

      try {
        let url = `https://api.streamtape.com/file/createfolder?login=${encodeURIComponent(login)}&key=${encodeURIComponent(key)}&name=${encodeURIComponent(folderName)}`;
        if (currentFolderId) {
          url += `&pid=${encodeURIComponent(currentFolderId)}`;
        }

        const response = await fetch(url);
        const data = await response.json();

        if (data.status === 200) {
          folderNameInput.value = '';
          loadFolders();
        } else {
          alert('Erro ao criar pasta: ' + data.msg);
        }
      } catch (err) {
        alert('Erro de conexão ao tentar criar a pasta.');
      }
    }

    // Consultar Informações do Ficheiro (/file/info)
    async function checkFileInfo(fileId) {
      const login = document.getElementById('apiLogin').value.trim();
      const key = document.getElementById('apiKey').value.trim();
      const resultBox = document.getElementById('resultBox');

      resultBox.style.display = 'block';
      resultBox.style.borderColor = '#38bdf8';
      resultBox.innerHTML = `Obtendo informações do ficheiro (ID: ${fileId})...`;

      try {
        const url = `https://api.streamtape.com/file/info?login=${encodeURIComponent(login)}&key=${encodeURIComponent(key)}&file=${encodeURIComponent(fileId)}`;
        const response = await fetch(url);
        const data = await response.json();

        if (data.status === 200 && data.result && data.result[fileId]) {
          const info = data.result[fileId];
          resultBox.innerHTML = `
            <strong style="color:#38bdf8;">ℹ️ Informações do Ficheiro:</strong><br><br>
            <strong>ID:</strong> ${info.id || fileId}<br>
            <strong>Nome:</strong> ${info.name}<br>
            <strong>Tamanho:</strong> ${formatBytes(info.size)} (${info.size} bytes)<br>
            <strong>Status / Conversão:</strong> ${info.convert || 'N/A'}<br>
            <strong>Tipo de Mídia:</strong> ${info.content_type || 'N/A'}<br>
            <strong>Downloads/Views:</strong> ${info.downloads || 0}<br>
            <strong>Link do Player:</strong> <a href="https://streamtape.com/v/${fileId}" target="_blank">https://streamtape.com/v/${fileId}</a>
          `;
        } else {
          resultBox.style.borderColor = '#ef4444';
          resultBox.innerHTML = `<strong style="color:#ef4444;">Erro ao obter informações:</strong> ${data.msg || 'Ficheiro não encontrado.'}`;
        }
      } catch (err) {
        resultBox.style.borderColor = '#ef4444';
        resultBox.innerHTML = `<strong style="color:#ef4444;">Erro de conexão ao consultar ficheiro.</strong>`;
      }
    }

    // Solução 1: Abrir o link do vídeo diretamente no navegador em uma nova aba
    function openVideoLink(fileId) {
      const videoUrl = `https://streamtape.com/v/${fileId}`;
      window.open(videoUrl, '_blank');
    }

    // Processo de Upload
    async function startUpload() {
      const login = document.getElementById('apiLogin').value.trim();
      const key = document.getElementById('apiKey').value.trim();
      const fileInput = document.getElementById('fileInput');
      const customFileName = document.getElementById('customFileName').value.trim();
      const uploadBtn = document.getElementById('uploadBtn');
      const progressContainer = document.getElementById('progressContainer');
      const progressBarFill = document.getElementById('progressBarFill');
      const statusText = document.getElementById('statusText');
      const resultBox = document.getElementById('resultBox');
      const currentFolderId = getCurrentFolderId();

      if (!login || !key) {
        alert('Por favor, preencha o API Login e a API Key.');
        return;
      }

      if (fileInput.files.length === 0) {
        alert('Por favor, selecione um arquivo.');
        return;
      }

      const file = fileInput.files[0];

      uploadBtn.disabled = true;
      progressContainer.style.display = 'block';
      resultBox.style.display = 'none';
      progressBarFill.style.width = '0%';
      statusText.innerText = 'Obtendo URL de upload...';

      try {
        let getUrlEndpoint = `https://api.streamtape.com/file/ul?login=${encodeURIComponent(login)}&key=${encodeURIComponent(key)}&httponly=1`;
        if (currentFolderId) {
          getUrlEndpoint += `&folder=${encodeURIComponent(currentFolderId)}`;
        }

        const response = await fetch(getUrlEndpoint);
        const data = await response.json();

        if (data.status !== 200 || !data.result || !data.result.url) {
          throw new Error(data.msg || 'Erro ao obter URL de upload.');
        }

        const uploadUrl = data.result.url;
        statusText.innerText = 'Enviando arquivo...';

        const formData = new FormData();
        formData.append('file', file);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', uploadUrl, true);

        xhr.upload.onprogress = function (e) {
          if (e.lengthComputable) {
            const percentComplete = Math.round((e.loaded / e.total) * 100);
            progressBarFill.style.width = percentComplete + '%';
            statusText.innerText = `Enviando: ${percentComplete}% (${formatBytes(e.loaded)} / ${formatBytes(e.total)})`;
          }
        };

        xhr.onload = async function () {
          try {
            const uploadResult = JSON.parse(xhr.responseText);

            if (uploadResult.status === 200) {
              const fileId = uploadResult.result.id;
              let finalUrl = uploadResult.result.url;

              if (customFileName && fileId) {
                statusText.innerText = 'Renomeando arquivo...';
                await renameFile(login, key, fileId, customFileName);
              }

              uploadBtn.disabled = false;
              statusText.innerText = 'Upload concluído com sucesso!';
              loadFolders(); // Atualiza a lista na tela

              resultBox.style.display = 'block';
              resultBox.style.borderColor = '#10b981';
              resultBox.innerHTML = `
                <strong style="color:#10b981;">✓ Sucesso! Arquivo enviado.</strong><br><br>
                <strong>ID do Arquivo:</strong> ${fileId || 'N/A'}<br>
                <strong>Nome Final:</strong> ${customFileName || file.name}<br>
                <strong>Pasta:</strong> ${folderHistory.map(f => f.name).join(' / ')}<br>
                <strong>Link do vídeo:</strong> <a href="${finalUrl}" target="_blank">${finalUrl}</a>
              `;
            } else {
              uploadBtn.disabled = false;
              statusText.innerText = 'Erro no Streamtape.';
              resultBox.style.display = 'block';
              resultBox.style.borderColor = '#ef4444';
              resultBox.innerHTML = `<strong style="color: #ef4444;">Erro (${uploadResult.status}):</strong> ${uploadResult.msg}`;
            }
          } catch (err) {
            uploadBtn.disabled = false;
            statusText.innerText = 'Resposta desconhecida.';
            resultBox.style.display = 'block';
            resultBox.innerHTML = `<strong>Resposta:</strong><br>${xhr.responseText}`;
          }
        };

        xhr.onerror = function () {
          uploadBtn.disabled = false;
          statusText.innerText = 'Erro na conexão.';
        };

        xhr.send(formData);

      } catch (err) {
        uploadBtn.disabled = false;
        statusText.innerText = 'Erro na solicitação.';
        resultBox.style.display = 'block';
        resultBox.style.borderColor = '#ef4444';
        resultBox.innerHTML = `<span style="color: #ef4444;">${err.message}</span>`;
      }
    }

    async function renameFile(login, key, fileId, newName) {
      try {
        const renameUrl = `https://api.streamtape.com/file/rename?login=${encodeURIComponent(login)}&key=${encodeURIComponent(key)}&file=${encodeURIComponent(fileId)}&name=${encodeURIComponent(newName)}`;
        await fetch(renameUrl);
      } catch (e) {
        console.error('Erro ao renomear arquivo:', e);
      }
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }
  </script>
</body>
</html>
